<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<title>WM mockup renderer</title>
<style>
  @font-face { font-family: 'Jost'; src: url('../fonts/jost-latin.woff2') format('woff2'); font-weight: 100 900; }
  html, body { margin: 0; background: transparent; }
  canvas { display: block; }
</style>
<script type="importmap">
{ "imports": {
  "three": "../node_modules/three/build/three.module.js",
  "three/addons/": "../node_modules/three/examples/jsm/"
} }
</script>
</head>
<body>
<script type="module">
import * as THREE from 'three';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';
import * as L from './lib.js';
import { PRODUCTS, EXTRA } from './products.js';
import { bag, bagScene } from './bags.js';

await L.init();
const q = new URLSearchParams(location.search);
const SCENE = q.get('scene') || 'pack:PP01';
const SIZE = +(q.get('size') || 1600), ASPECT = +(q.get('aspect') || 1);

// ------------------------------------------------------------------ studio: stessa luce per tutti i prodotti
const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true, preserveDrawingBuffer: true });
renderer.setPixelRatio(1); renderer.setSize(SIZE, Math.round(SIZE / ASPECT));
renderer.shadowMap.enabled = true; renderer.shadowMap.type = THREE.VSMShadowMap;
renderer.toneMapping = THREE.NeutralToneMapping; renderer.toneMappingExposure = 0.95;
renderer.outputColorSpace = THREE.SRGBColorSpace; renderer.setClearColor(0x000000, 0);
document.body.appendChild(renderer.domElement);
const scene = new THREE.Scene();
const pmrem = new THREE.PMREMGenerator(renderer);
scene.environment = pmrem.fromScene(new RoomEnvironment(), 0.04).texture;
scene.environmentIntensity = 0.85;
scene.add(new THREE.HemisphereLight(0xffffff, 0xdfe8e3, 0.45));
const key = new THREE.DirectionalLight(0xfff8f0, 2.2); key.castShadow = true;
key.shadow.mapSize.set(2048, 2048); key.shadow.radius = 12; key.shadow.blurSamples = 20; key.shadow.bias = -0.0006;
scene.add(key, key.target);
const fill = new THREE.DirectionalLight(0xe8f3ff, 0.5); scene.add(fill, fill.target);
const rim = new THREE.DirectionalLight(0xffffff, 0.7); scene.add(rim, rim.target);
const ground = new THREE.Mesh(new THREE.PlaneGeometry(1000, 1000), new THREE.ShadowMaterial({ opacity: 0.2 }));
ground.rotation.x = -Math.PI / 2; ground.receiveShadow = true; scene.add(ground);

// ombra di contatto (occlusione morbida sotto gli oggetti)
function contact(obj) {
  const [c, x] = L.cnv(256, 256); const g = x.createRadialGradient(128, 128, 0, 128, 128, 128);
  g.addColorStop(0, 'rgba(0,0,0,0.55)'); g.addColorStop(0.55, 'rgba(0,0,0,0.22)'); g.addColorStop(1, 'rgba(0,0,0,0)'); x.fillStyle = g; x.fillRect(0, 0, 256, 256);
  const t = new THREE.CanvasTexture(c);
  obj.updateMatrixWorld(true);
  const parts = obj.children.length > 1 ? obj.children : [obj];
  for (const p of parts) {
    const b = new THREE.Box3().setFromObject(p); if (b.isEmpty()) continue;
    const s = b.getSize(new THREE.Vector3()), cc = b.getCenter(new THREE.Vector3());
    if (b.min.y > 1) continue;
    const m = new THREE.Mesh(new THREE.PlaneGeometry(s.x * 1.25 + 1, s.z * 1.25 + 1), new THREE.MeshBasicMaterial({ map: t, transparent: true, depthWrite: false, opacity: 0.55 }));
    m.rotation.x = -Math.PI / 2; m.position.set(cc.x, 0.02, cc.z); m.renderOrder = -1; scene.add(m);
  }
}

// ------------------------------------------------------------------ scene
const at = (o, x = 0, z = 0, ry = 0, s = 1) => { o.position.set(x, 0, z); o.rotation.y = ry; o.scale.setScalar(s); return o; };
const SEL_BAGS = {
  'shopper-kraft': () => bag({ w: 32, h: 41, d: 13, body: '#c29a70', inner: '#c29a70', kraft: true, handle: 'rope', handleColor: '#c9a57a', seedN: 3 }),
  'shopper-navy': () => bag({ w: 27, h: 37, d: 12, fold: 6, body: L.NAVY, inner: '#f3f1ea', handle: 'cotton', handleColor: '#eef3ef', seedN: 4 }),
  'shopper-white': () => bag({ w: 32, h: 29, d: 22, body: '#f3f1ea', inner: '#f3f1ea', handle: 'flat', handleColor: '#ece9e1', style: 'takeaway', seedN: 5 }),
  'shopper-green': () => bag({ w: 22, h: 29, d: 10, body: '#7fb596', inner: '#f3f1ea', handle: 'rope', handleColor: L.NAVY, seedN: 6 }),
};
async function build(name) {
  const [kind, id] = name.split(':');
  if (kind === 'pack') return PRODUCTS[id][0]();
  if (kind === 'bag') { const data = await (await fetch('../build/data/shopper.json')).json(); return bagScene(data[+id]); }
  if (kind === 'sel') return SEL_BAGS[id] ? SEL_BAGS[id]() : (EXTRA[id] || PRODUCTS[id])[0]();
  const P = (i) => PRODUCTS[i][0]();
  const g = new THREE.Group();
  if (name === 'hero') g.add(at(SEL_BAGS['shopper-navy'](), -16, -8, 0.32), at(SEL_BAGS['shopper-kraft'](), 14, -12, -0.28), at(P('PP01'), -3, 13, 0.4), at(EXTRA.cup[0](), 13, 15), at(P('BB02'), 27, 8), at(P('CE03'), -25, 13, 0.5));
  if (name === 'hero-food') g.add(at(P('PP01'), -9, 0, 0.45), at(EXTRA.cup[0](), 8, 6), at(P('CE03'), 20, -4, -0.3), at(P('BB02'), -1, -15), at(P('CE02'), -31, -18, 0.5), at(P('SF08'), 22, 10, -0.2));
  if (name === 'hero-bags') g.add(at(SEL_BAGS['shopper-kraft'](), -18, -2, 0.35), at(SEL_BAGS['shopper-navy'](), 13, -8, -0.3), at(SEL_BAGS['shopper-white'](), 2, 17, 0.1, 0.8));
  if (name === 'hero-pastry') g.add(at(P('PA08'), -15, -9, 0.5), at(P('PA01'), 16, 4, -0.4), at(EXTRA['cup-mint'][0](), 0, 21));
  if (name === 'hero-gift') g.add(at(P('BR04'), -14, -4, 0.35), at(P('EC02'), 14, 6, -0.3), at(P('BR01'), -34, 10, 0.2, 0.9));
  return g;
}
const obj = await build(SCENE); scene.add(obj); contact(obj);
// camera predefinita del prodotto (se non indicata nell'URL)
{ const [kind, id] = SCENE.split(':'); const reg = kind === 'pack' ? PRODUCTS[id] : kind === 'sel' ? (EXTRA[id] || PRODUCTS[id]) : null;
  if (reg && !q.has('az')) for (const [k, v] of new URLSearchParams(reg[1])) q.set(k, v);
  if (kind === 'bag' && !q.has('az')) { q.set('az', '22'); q.set('el', '14'); } }

// ------------------------------------------------------------------ camera: inquadratura automatica
const box = new THREE.Box3().setFromObject(obj), sphere = box.getBoundingSphere(new THREE.Sphere());
const camera = new THREE.PerspectiveCamera(+(q.get('fov') || 22), ASPECT, 1, 3000);
const az = +(q.get('az') || 28) * Math.PI / 180, el = +(q.get('el') || 22) * Math.PI / 180;
const dist = sphere.radius / Math.sin(camera.fov * Math.PI / 360) * 1.02;
const dir = new THREE.Vector3(Math.cos(el) * Math.sin(az), Math.sin(el), Math.cos(el) * Math.cos(az));
camera.position.copy(sphere.center).addScaledVector(dir, dist); camera.lookAt(sphere.center);
const R = sphere.radius;
key.position.copy(sphere.center).add(new THREE.Vector3(-1.1 * R, 2.4 * R, 1.3 * R)); key.target.position.copy(sphere.center);
Object.assign(key.shadow.camera, { left: -R * 1.8, right: R * 1.8, top: R * 1.8, bottom: -R * 1.8, near: 0.1, far: R * 8 }); key.shadow.camera.updateProjectionMatrix();
fill.position.copy(sphere.center).add(new THREE.Vector3(2 * R, 0.8 * R, 1.2 * R)); fill.target.position.copy(sphere.center);
rim.position.copy(sphere.center).add(new THREE.Vector3(0.5 * R, 1.5 * R, -2 * R)); rim.target.position.copy(sphere.center);
renderer.render(scene, camera);
window.__done = true;
</script>
</body>
</html>
