<!doctype html>
<html lang="it"><head><meta charset="utf-8"><title>WM emboss</title>
<style>html,body{margin:0;background:transparent}canvas{display:block}</style>
<script type="importmap">{ "imports": { "three": "../../node_modules/three/build/three.module.js", "three/addons/": "../../node_modules/three/examples/jsm/" } }</script>
</head><body><script type="module">
// Simbolo Waste Management in rilievo: estrusione del tracciato originale (nessuna modifica al disegno).
import * as THREE from 'three';
import { SVGLoader } from 'three/addons/loaders/SVGLoader.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';
const q = new URLSearchParams(location.search);
const W = +(q.get('w') || 2600), H = +(q.get('h') || 2600), MODE = q.get('mode') || 'color';
const SPEC = +(q.get('spec') ?? 0.5), ROUGH = +(q.get('rough') || 0.5), KEY = +(q.get('key') || 1.9), EXP = +(q.get('exp') || 0.82), CAMY = +(q.get('camy') || 0);
const EL = +(q.get('el') || 90), AZ = +(q.get('az') || 0), DEPTH = +(q.get('depth') || 14), FRAME = +(q.get('frame') || 1.6);
const r = new THREE.WebGLRenderer({ antialias: true, alpha: MODE === 'alpha', preserveDrawingBuffer: true });
r.setPixelRatio(1); r.setSize(W, H); r.shadowMap.enabled = true; r.shadowMap.type = THREE.VSMShadowMap;
r.toneMapping = q.get('tm') === 'none' ? THREE.NoToneMapping : THREE.NeutralToneMapping; r.toneMappingExposure = EXP; r.outputColorSpace = THREE.SRGBColorSpace;
document.body.appendChild(r.domElement);
const scene = new THREE.Scene();
scene.environment = new THREE.PMREMGenerator(r).fromScene(new RoomEnvironment(), 0.04).texture; scene.environmentIntensity = +(q.get('env') ?? 0.3);
const PETROL = new THREE.Color('#0a2a39');
if (MODE !== 'alpha') scene.background = PETROL.clone();

const d = (await (await fetch('../../assets/symbol_path.txt')).text()).split('\n')[1];
const data = new SVGLoader().parse(`<svg xmlns="http://www.w3.org/2000/svg"><path d="${d}"/></svg>`);
const shapes = data.paths.flatMap(p => SVGLoader.createShapes(p));
const geo = new THREE.ExtrudeGeometry(shapes, { depth: DEPTH, bevelEnabled: true, bevelThickness: 2.2, bevelSize: 1.6, bevelSegments: 8, curveSegments: 48 });
geo.computeBoundingBox(); const bb = geo.boundingBox.clone(); // translate() ricalcola il box: serve una copia
const cx = (bb.min.x + bb.max.x) / 2, cy = (bb.min.y + bb.max.y) / 2;
geo.translate(-cx, -cy, 0); geo.scale(1, -1, 1); // SVG ha la y verso il basso
// lo specchio inverte l'ordine dei vertici: ripristina la normale verso l'esterno
for (const name of Object.keys(geo.attributes)) {
  const a = geo.attributes[name], n = a.itemSize, arr = a.array;
  for (let t = 0; t < a.count; t += 3) for (let k = 0; k < n; k++) { const i1 = (t + 1) * n + k, i2 = (t + 2) * n + k; const tmp = arr[i1]; arr[i1] = arr[i2]; arr[i2] = tmp; }
}
// gradiente originale verde → bianco lungo x, come nel logo
const pos = geo.attributes.position, col = new Float32Array(pos.count * 3);
const g0 = new THREE.Color('#73b18d'), g1 = new THREE.Color('#fdfefd'), tone = new THREE.Color('#123b4c');
for (let i = 0; i < pos.count; i++) {
  const t = (pos.getX(i) - (bb.min.x - cx)) / (bb.max.x - bb.min.x);
  const tt = Math.min(1, Math.max(0, t)), s0 = g0.getRGB({}, THREE.SRGBColorSpace), s1 = g1.getRGB({}, THREE.SRGBColorSpace);
  // interpolazione in sRGB, come il gradiente del logo vettoriale
  const c = MODE === 'tone' ? tone.clone() : new THREE.Color().setRGB(s0.r + (s1.r - s0.r) * tt, s0.g + (s1.g - s0.g) * tt, s0.b + (s1.b - s0.b) * tt, THREE.SRGBColorSpace);
  col[i * 3] = c.r; col[i * 3 + 1] = c.g; col[i * 3 + 2] = c.b;
}
geo.setAttribute('color', new THREE.BufferAttribute(col, 3));
geo.computeVertexNormals();
const mat = new THREE.MeshPhysicalMaterial({ vertexColors: true, roughness: MODE === 'tone' ? 0.62 : ROUGH, metalness: 0, specularIntensity: SPEC, clearcoat: MODE === 'tone' ? 0.1 : 0.12 * SPEC, clearcoatRoughness: 0.35 });
const sym = new THREE.Mesh(geo, q.get('unlit') ? new THREE.MeshBasicMaterial({ vertexColors: true }) : mat); sym.castShadow = true; sym.receiveShadow = true; scene.add(sym);

// fondo: cartoncino blu petrolio con grana
const N = 1024, cv = document.createElement('canvas'); cv.width = cv.height = N; const x = cv.getContext('2d');
const img = x.createImageData(N, N); for (let i = 0; i < img.data.length; i += 4) { const v = 128 + (Math.random() - .5) * 30; img.data[i] = img.data[i + 1] = 128; img.data[i + 2] = 255; img.data[i] = v; img.data[i + 3] = 255; }
x.putImageData(img, 0, 0); const nt = new THREE.CanvasTexture(cv); nt.wrapS = nt.wrapT = THREE.RepeatWrapping; nt.repeat.set(6, 6);
const ground = new THREE.Mesh(new THREE.PlaneGeometry(4000, 4000),
  MODE === 'alpha' ? new THREE.ShadowMaterial({ opacity: 0.35 }) : new THREE.MeshStandardMaterial({ color: PETROL, roughness: 0.9, normalMap: nt, normalScale: new THREE.Vector2(0.25, 0.25) }));
ground.receiveShadow = true; ground.position.z = -0.01; scene.add(ground);

const key = new THREE.DirectionalLight(0xffffff, KEY); key.position.set(-260, 320, 420); key.castShadow = true;
key.shadow.mapSize.set(4096, 4096); key.shadow.radius = 10; key.shadow.blurSamples = 24;
Object.assign(key.shadow.camera, { left: -300, right: 300, top: 300, bottom: -300, near: 1, far: 2000 }); key.shadow.bias = -0.0005;
scene.add(key, new THREE.HemisphereLight(0xdfeee6, 0x0a2a39, +(q.get('hemi') ?? 0.35)));
const rim = new THREE.DirectionalLight(0x9fd3b6, 0.8); rim.position.set(300, -200, 160); scene.add(rim);

const cam = new THREE.PerspectiveCamera(20, W / H, 1, 5000);
const size = Math.max(bb.max.x - bb.min.x, bb.max.y - bb.min.y) * FRAME;
const dist = size / 2 / Math.tan(THREE.MathUtils.degToRad(10));
const el = THREE.MathUtils.degToRad(EL), az = THREE.MathUtils.degToRad(AZ);
cam.position.set(Math.sin(az) * Math.cos(el) * dist, -Math.cos(az) * Math.cos(el) * dist * (EL < 90 ? 1 : 0), Math.sin(el) * dist);
cam.position.y += CAMY; cam.up.set(0, 1, 0); cam.lookAt(0, CAMY, DEPTH / 2);
r.render(scene, cam); window.__done = true;
</script></body></html>
